name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/zu-de-clemens
      - name: Install D2
        run: |
          curl -fsSL https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz | tar -xz
          echo "$PWD/d2-v0.9.0/bin" >> "$GITHUB_PATH"
      - name: Test
        run: claude plugin test plugins/zu-de-clemens
      - name: Check catalog samples
        run: node scripts/check-catalog.mjs
